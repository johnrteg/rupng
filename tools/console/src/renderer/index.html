<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- local-only desktop tool: lock down to self + inline styles MUI/emotion needs.
             script-src allows 'unsafe-eval' because ajv (the @repo/api config validators + the JSON
             editor's schema linter) compiles schemas with `new Function`; the vite dev renderer needs it
             too. Acceptable for a local internal tool — default-src stays 'self' and connect-src is scoped. -->
        <meta http-equiv="Content-Security-Policy"
              content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws:; font-src 'self' data:;" />
        <title>RumbleUp Console</title>
        <style>
            html, body, #root { height: 100%; margin: 0; }
            body { background: #0e1116; overflow: hidden; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
