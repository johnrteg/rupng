#
# Local cloud development stack.
#
#   * localstack — emulates AWS (S3, SQS, SNS, DynamoDB, Lambda, API Gateway, KMS,
#     Secrets, RDS, ElastiCache, OpenSearch, Cognito, CloudFront, EventBridge, ECS,
#     Batch, …). Pro is assumed — set LOCALSTACK_AUTH_TOKEN in your environment.
#   * kafka — a Redpanda broker standing in for MSK (which LocalStack doesn't emulate
#     reliably); the CDK skips managed MSK under env=local and services point here.
#
# Bring it up with `npm run local:up` (from /cloud), then `npm run local:bootstrap`
# and `npm run local:deploy`. See README.md in this folder.
#
services:
  localstack:
    image: localstack/localstack-pro:latest      # community image: localstack/localstack
    ports:
      - "4566:4566"                               # the single AWS edge endpoint
      - "4510-4559:4510-4559"                     # external service ports (Lambda, etc.)
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}   # Pro token (required for Pro services)
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}             # 1 = keep state across restarts
      - LAMBDA_RUNTIME_EXECUTOR=docker
    volumes:
      - "./.volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"   # LocalStack launches Lambda containers

  kafka:
    image: redpandadata/redpanda:latest           # Kafka-API compatible, lightweight
    command:
      - redpanda start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"                               # services read KAFKA_BROKERS=localhost:9092 locally
