#
# Run the app service roles as Docker images — locally and against LocalStack.
# These are the SAME images ECS runs; the image is the shared root Dockerfile
# (APP_NAME=app / APP_PATH=core/app), and each role is that image with a different
# SERVICE_ROLE + PORT (its slot in the APP port block — @repo/services Ports).
#
#   docker compose -f apps/core/app/docker-compose.yml up --build
#   curl localhost:8100/health   # main      curl localhost:8101/health   # public
#   docker compose -f apps/core/app/docker-compose.yml down
#
# AWS_ENDPOINT_URL points the SDK facades (sdkConfig) at LocalStack; unset on a real deploy.
#
name: rupapp-app

x-app-env: &app-env
  HOST: "0.0.0.0"
  AWS_ENDPOINT_URL: http://host.docker.internal:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

services:
  app-main:
    build:
      context: ../../..          # repo root — the root Dockerfile prunes the workspace to `app`
      dockerfile: Dockerfile
      args:
        APP_NAME: app
        APP_PATH: core/app
    image: rupapp-app:local
    environment:
      <<: *app-env
      SERVICE_ROLE: main
      PORT: "8100"
    ports:
      - "8100:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-public:
    image: rupapp-app:local      # reuse the image built by app-main
    environment:
      <<: *app-env
      SERVICE_ROLE: public
      PORT: "8101"
    ports:
      - "8101:8101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app-main
